# Publishes the page to GitHub Pages, at gedcom-viewer.net. A version tag (v0.5.2, …) runs the
# tests, and then uploads the page's files alone — never the tests, the tools, the brief, or
# anything in local/. "Run workflow" on the Actions tab publishes what main holds, by hand.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gather the page's files
        run: |
          mkdir site
          cp index.html style.css core.js save.js ui.js privacy.html favicon.svg favicon.ico apple-touch-icon.png site/
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
