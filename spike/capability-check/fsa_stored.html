<!doctype html>
<meta charset="utf-8">
<title>pending</title>
<pre id="out"></pre>
<script>
// Two-run check: run 1 stores each result in localStorage as it settles; run 2 prints what
// run 1 stored, synchronously, before the page's load event. Booleans / error names only.
const KEY = 'gedview-fsa-results';
const stored = localStorage.getItem(KEY);
document.getElementById('out').textContent = stored || '{"stored": "nothing yet"}';
if (stored) document.title = 'read';

const r = {};
const save = () => localStorage.setItem(KEY, JSON.stringify(r, null, 1));
const within = (ms, p) => Promise.race([
  p, new Promise((res) => setTimeout(() => res('TIMEOUT'), ms)),
]);
const tests = {
  digest: async () => (await crypto.subtle.digest('SHA-256', new Uint8Array([1]))).byteLength === 32,
  fetchSibling: async () => (await fetch('./fsa_classic.js')).ok,
  moduleImport: async () => (await import('./fsa_mod.js')).ok,
  workerFromSibling: async () => new Promise((res) => {
    const w = new Worker('./fsa_classic.js');
    w.onerror = () => res('ERR onerror');
    setTimeout(() => { w.terminate(); res('constructed, no error'); }, 300);
  }),
  workerFromBlob: async () => new Promise((res) => {
    const url = URL.createObjectURL(new Blob(['postMessage(1)'], { type: 'text/javascript' }));
    const w = new Worker(url);
    w.onmessage = () => res(true);
    w.onerror = () => res('ERR onerror');
  }),
  indexedDbOpen: async () => new Promise((res) => {
    const q = indexedDB.open('gedview-check', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('s');
    q.onsuccess = () => res(true);
    q.onerror = () => res('ERR ' + (q.error && q.error.name));
  }),
  opfsWriteThenAppend: async () => {
    const root = await navigator.storage.getDirectory();
    const sub = await root.getDirectoryHandle('gedview-history', { create: true });
    const fh = await sub.getFileHandle('t.bak', { create: true });
    const w = await fh.createWritable();
    await w.write(new Uint8Array([65, 66]));
    await w.close();
    const w2 = await fh.createWritable({ keepExistingData: true });
    await w2.seek(2);
    await w2.write(new Uint8Array([67]));
    await w2.close();
    return 'size ' + (await fh.getFile()).size + ' resolve ' + JSON.stringify(await root.resolve(fh));
  },
};
if (!stored) {
  (async () => {
    for (const [name, fn] of Object.entries(tests)) {
      try { r[name] = await within(1500, fn()); }
      catch (e) { r[name] = 'ERR ' + e.name + ': ' + String(e.message).slice(0, 90); }
      save();
    }
    r.finished = true;
    save();
  })();
}
</script>
