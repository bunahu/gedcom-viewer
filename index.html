<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The browser enforces what the page promises: nothing is loaded from, or sent to, anywhere but the page's own files.
     Styles may be inline only because Chrome styles its own XML parse-error block inline, in the inert document a
     malformed _META is read in (ui.js, metaOf); the page writes no inline style, and nothing it draws from a file may
     carry one (core.js, the allowlist). An inline style can reach nothing outside the page either: images, fonts and
     connections stay refused. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>GEDCOM Viewer</title>
<meta name="description" content="Read, check and hand-edit a GEDCOM file in your browser, and save it with a log of what changed. Nothing is uploaded: the file never leaves your computer.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<header class="bar">
  <div class="bar-top">
    <button class="icon-button" id="hide-left" type="button" aria-pressed="false" aria-label="Hide left bar" title="Hide left bar"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <span class="app-name"><span class="app-title"><span class="app-title-gedcom">GEDCOM</span> Viewer</span> <span class="version" title="Version">0.5.3</span></span>
    <button class="file-name" id="file-name" type="button" aria-expanded="false" hidden></button>
    <span class="dirty" id="dirty" title="Changed since it was opened or last saved" hidden>●</span>
    <nav class="actions">
      <button class="button" id="edit" type="button" aria-pressed="false" title="Edit on or off (E)" disabled>Edit</button>
      <button class="button" id="undo" type="button" disabled>Undo</button>
      <button class="button" id="redo" type="button" disabled>Redo</button>
      <button class="button" id="save" type="button" title="Save, in place (⌘S)" disabled>Save</button>
      <button class="button" id="save-copy" type="button" title="Save a dated copy (⇧⌘S)" disabled>Save a copy</button>
      <span class="gap"></span>
      <span class="goto-box">
        <input class="input goto" id="goto" type="text" placeholder="Go to Line…" aria-label="Go to line" autocomplete="off" disabled>
        <button class="button goto-go" id="goto-go" type="button" hidden>Go</button>
        <button class="button goto-clear" id="goto-clear" type="button" title="Every line again" hidden>×</button>
      </span>
      <button class="button" id="settings" type="button" popovertarget="settings-menu">Settings</button>
      <button class="icon-button" id="hide-right" type="button" aria-pressed="false" aria-label="Hide right frame" title="Hide right frame"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 3.5v13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </nav>
  </div>
  <div class="facts" id="facts" hidden></div>
</header>

<!-- Settings: the smaller controls, in a menu under the button -->
<div class="menu" id="settings-menu" popover>
  <div class="menu-row">
    <span class="menu-name">Theme</span>
    <span class="menu-choices">
      <button class="button" id="theme-light" type="button" aria-pressed="false">Light</button>
      <button class="button" id="theme-sunset" type="button" aria-pressed="false">Sunset</button>
      <button class="button" id="theme-dark" type="button" aria-pressed="false">Dark</button>
    </span>
  </div>
  <div class="menu-row">
    <span class="menu-name">Lines</span>
    <span class="menu-choices">
      <button class="button" id="indent" type="button" aria-pressed="false">Indent</button>
      <input class="input indent-width" id="indent-width" type="number" min="1" max="12" aria-label="Indent width" hidden>
    </span>
  </div>
  <div class="menu-row">
    <span class="menu-name">Names</span>
    <span class="menu-choices">
      <button class="button" id="surnames" type="button" aria-pressed="false" title="Surnames in bold, without their slashes, wherever a record is named; a line as written is never changed">Bold surnames</button>
    </span>
  </div>
  <div class="menu-row">
    <span class="menu-name">Help</span>
    <span class="menu-choices">
      <button class="button" id="report" type="button" title="A report of counts and codes, never a line of the file, to read, change and copy into an issue; nothing is sent">Report a problem…</button>
    </span>
  </div>
</div>

<nav class="counts" id="counts" aria-label="Records by type"></nav>

<main class="work" id="work">
  <aside class="side" id="side">
    <nav class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-panel="records" aria-selected="true">Records</button>
      <button class="tab" type="button" role="tab" data-panel="checks">Checks <span class="tab-count" id="checks-count"></span></button>
      <button class="tab" type="button" role="tab" data-panel="changes">Changes <span class="tab-count" id="changes-count"></span></button>
      <button class="tab" type="button" role="tab" data-panel="search">Search</button>
      <button class="tab" type="button" role="tab" data-panel="tags">Tags</button>
    </nav>

    <section class="panel" id="panel-records">
      <div class="panel-head">
        <input class="input" id="records-filter" type="search" aria-label="Filter records">
        <button class="chip" id="records-type" type="button" hidden></button>
      </div>
      <div class="list" id="records-list"></div>
    </section>

    <section class="panel" id="panel-checks" hidden>
      <div class="panel-sum" id="checks-sum"></div>
      <div class="list" id="checks-list"></div>
    </section>

    <section class="panel" id="panel-changes" hidden>
      <div class="panel-sum" id="changes-sum"></div>
      <div class="list" id="changes-list"></div>
    </section>

    <section class="panel" id="panel-search" hidden>
      <div class="panel-head">
        <input class="input" id="search-box" type="search" aria-label="Search">
        <button class="button" id="search-tag" type="button" aria-pressed="false">Tag</button>
      </div>
      <div class="search-nav">
        <button class="button" id="search-prev" type="button">Previous</button>
        <span class="search-count" id="search-count"></span>
        <button class="button" id="search-next" type="button">Next</button>
      </div>
    </section>

    <section class="panel" id="panel-tags" hidden>
      <div class="panel-head panel-head-end">
        <button class="icon-button" id="tags-order" type="button" aria-label="Another order"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10a6 6 0 0 1 10.4-4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14.6 2.6v3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10a6 6 0 0 1-10.4 4.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.4 17.4v-3.6H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="list" id="tags-list"></div>
    </section>
  </aside>

  <div class="split" id="split-left" title="Drag to widen or narrow"></div>

  <section class="middle">
    <div class="strip" id="strip">
      <button class="button" id="top" type="button" title="Line 1" disabled>↑ Top</button>
      <button class="button" id="back" type="button" hidden>← Back</button>
      <span class="strip-gap"></span>
      <button class="button" id="fold-all" type="button" title="Shut every record to its first line and every type to its row, or open every block and every type" hidden>Collapse all</button>
    </div>
    <div class="grid" id="grid" tabindex="0" aria-label="Lines"></div>
    <div class="empty" id="empty">
      <button class="button" id="open-empty" type="button">Open GEDCOM</button>
      <div class="message" id="message" hidden></div>
      <p class="empty-note">Nothing is uploaded: the file is read here, in your browser, and never leaves your computer. <a href="privacy.html">Privacy</a></p>
    </div>
    <div class="notice" id="notice" role="status" hidden></div>
  </section>

  <div class="split" id="split-right" title="Drag to widen or narrow"></div>

  <aside class="detail" id="detail"></aside>
</main>

<dialog class="dialog" id="dialog"></dialog>
<div class="drop" id="drop" hidden></div>
<input id="file-input" type="file" accept=".ged,.gedcom" hidden>

<!-- the copy button's two icons: two overlapping squares, then a check mark -->
<template id="icon-copy"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></template>
<template id="icon-check"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

<script src="core.js" charset="utf-8"></script>
<script src="save.js" charset="utf-8"></script>
<script src="ui.js" charset="utf-8"></script>
</body>
</html>
